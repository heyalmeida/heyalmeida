name: Update profile art

on:
  schedule:
    # ~06:17 UTC daily — off the hour so GitHub's cron queue is less congested.
    - cron: "17 6 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "package.json"
      - ".github/workflows/update-profile-art.yml"

permissions:
  contents: write

concurrency:
  group: profile-art
  cancel-in-progress: false

jobs:
  contribution-city:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # No install step: the generators are dependency-free Node scripts.
      - name: Scrape the public contribution calendar
        run: node scripts/fetch-contributions.mjs

      - name: Render the animated contribution city
        run: node scripts/render-heatmap.mjs

      - name: Commit the refreshed city
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh contribution city [skip ci]"
          file_pattern: "data/contributions.json assets/contrib-heatmap.svg assets/contrib-city.svg"
